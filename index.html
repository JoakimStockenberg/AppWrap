<!DOCTYPE html>
<!-- Could be improved by using SVG icons or an animated load icon instead of "Loading..."-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>App Wrapper</title>
  </head>
  <body>
    
    <!-- Apple's 4.2 minimum functions guidelines, Native Utility header-->
    <header id="native-toolbar" class="app-header">
      <div class="header-button-group">
        <button id="btn-back" class="native-button">Back</button>
        <button id="btn-refresh" class="native-button">Reload</button>
      </div>
      <span id="app-title-display" class="app-title">App</span>
      <div id="loading-spinner">Loading...</div>
    </header>

    <!-- The Web Container -->
    <main style="position: relative; width: 100%; height: 100%; overflow: hidden;">
      <iframe id="web-viewport" style="width: 100%; height: 100%; border: 0;" allow="geolocation; microphone; camera; display-capture"></iframe>

      <!-- Offline Error Boundary -->
      <div id="offline-boundary" class="offline-card-overlay hidden">
        <h2>No Connection Available</h2>
        <p>Unable to load the application. Please check your internet connection.</p>
        <button id="btn-retry" class="retry-button">Retry Connection</button>
      </div>
    </main>

    <!-- App Engine Entrypoint -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
